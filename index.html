<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Family Games</h1>
    <p>Play together, wherever you are.</p>
  </header>

  <main class="container">
    <!-- Home screen -->
    <section id="home-screen" class="screen">
      <h2>Choose a game</h2>

      <div class="game-cards">
        <button class="game-card" data-game="letter">
          <span class="game-icon">🔤</span>
          <strong>Category Letter Game</strong>
          <small>Think of answers beginning with the chosen letter.</small>
        </button>

        <button class="game-card" data-game="trivia">
          <span class="game-icon">❓</span>
          <strong>Trivia</strong>
          <small>Answer multiple-choice questions and earn points.</small>
        </button>
      </div>
    </section>

    <!-- Game setup screen -->
    <section id="setup-screen" class="screen hidden">
      <button id="back-button" class="secondary-button">← Back</button>

      <h2 id="selected-game-title"></h2>
      <p>Choose categories for this game.</p>

      <div id="category-list" class="category-list"></div>

      <label for="player-name">Your name</label>
      <input
        id="player-name"
        type="text"
        placeholder="Enter your name"
        maxlength="20"
      >

      <button id="start-button" class="primary-button">
        Continue to lobby
      </button>

      <p id="setup-message" class="message"></p>
    </section>

    <!-- Lobby screen -->
    <section id="lobby-screen" class="screen hidden">
      <button id="lobby-back-button" class="secondary-button">
        ← Back to setup
      </button>

      <h2>Game lobby</h2>

      <p>
        Game:
        <strong id="lobby-game-name"></strong>
      </p>

      <div class="room-card">
        <p>Room code</p>
        <strong id="room-code">ABC123</strong>
        <small>Share this code with the other players.</small>
      </div>

      <h3>Players</h3>
      <ul id="players-list" class="players-list"></ul>

      <button id="demo-start-button" class="primary-button">
        Start demo round
      </button>

      <p id="lobby-message" class="message"></p>
    </section>
  </main>

  <footer>
    <p>Family Games prototype</p>
  </footer>

  <script src="script.js?v=3"></script>
</body>
</html>
